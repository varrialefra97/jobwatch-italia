name: Update Jobs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests beautifulsoup4 pyyaml

      - run: python scripts/update_jobs.py

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "auto update jobs"
          git push
